<script>
  // Compatibilidad con los enlaces antiguos: la tienda usaba rutas por hash
  // (fitfuelgt.com/#/producto/whey-vainilla). Los que ya se compartieron por WhatsApp o
  // están guardados en marcadores siguen llegando así, y se reescriben aquí a la ruta real
  // ANTES de que arranque la app. Solo se tocan los hashes que empiezan por "#/": el
  // "#access_token=..." con el que vuelve el login de Google se deja intacto.
  (function () {
    var h = window.location.hash;
    if (h && h.indexOf("#/") === 0) {
      var dest = h.slice(1) + window.location.search;
      window.history.replaceState({}, "", dest);
    }
  })();
</script>
</head>
<body>
<!-- Pantalla de carga: va en el HTML inicial, así que se ve en cuanto llega la primera
     respuesta, sin esperar a los 336 KB del bundle. React la sustituye al montar. -->
<style>
  #ff-boot{position:fixed;inset:0;display:grid;place-items:center;gap:18px;
    align-content:center;background:#141210;z-index:9999}
  #ff-boot span{font:800 15px/1 Archivo,system-ui,sans-serif;letter-spacing:.42em;
    text-indent:.42em;color:#EAE7DF;opacity:.9}
  #ff-boot i{display:block;width:120px;height:2px;border-radius:2px;
    background:rgba(234,231,223,.14);overflow:hidden}
  #ff-boot i::after{content:"";display:block;width:40%;height:100%;border-radius:2px;
    background:#C6F24E;animation:ff-boot-slide 1.1s cubic-bezier(.4,0,.6,1) infinite}
  @keyframes ff-boot-slide{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
  @media (prefers-reduced-motion:reduce){
    #ff-boot i::after{animation:none;width:100%;opacity:.5}
  }
</style>
<div id="root">
  <div id="ff-boot" role="status" aria-live="polite" aria-label="Cargando FITFUEL">
    <span>FITFUEL</span><i></i>
  </div>
</div>

<!-- Catálogo y defaults (script clásico; provee window.FF antes del módulo) -->
<script src="/data.js"></script>
<!-- App (bundle de Vite) -->
<script type="module" src="/main.jsx"></script>
</body>
